name: Release Version Update

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "release=$VERSION" >> "$GITHUB_OUTPUT"

          # Compute next SNAPSHOT: bump patch by 1
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_PATCH=$((PATCH + 1))
          echo "snapshot=${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.release }} -DgenerateBackupPoms=false

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Release ${{ steps.version.outputs.release }} [skip ci]"
          git push

      - name: Set next SNAPSHOT version
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.snapshot }} -DgenerateBackupPoms=false

      - name: Commit SNAPSHOT version
        run: |
          git add pom.xml
          git commit -m "Prepare next development iteration ${{ steps.version.outputs.snapshot }} [skip ci]"
          git push
